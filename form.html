<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description" content="A webpage designed to demonstrate strong skills in building and editing interactive forms using HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
        
            <fieldset>
                <label for="productName" class="bold">*Product Name</label><br>

                <select id="productName" name="productName" required>

                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>
        
            <fieldset>
                <label class="bold">*Overall Rating</label><br>

                <div class="stars">
                    <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                </div>
            </fieldset>
        
            <fieldset>
                <label for="installDate" class="bold">*Date of Installation</label><br>

                <input type="date" id="installDate" name="installDate" required>
            </fieldset>
        
            <fieldset>
                <legend>
                    <span class="bold">What did you find the most useful in this product?<br>
                    (Please check all that apply)</span>
                </legend>
                
                <label for="featureSupport">Customer Support</label>
                <input type="checkbox" id="featureSupport" name="features" value="Customer Support">

                <label for="featureDesign"><br>Design</label>
                <input type="checkbox" id="featureDesign" name="features" value="Design">

                <label for="featureEase"><br>Ease of Use</label>
                <input type="checkbox" id="featureEase" name="features" value="Ease of Use">
                
                <label for="featurePerformance"><br>Performance</label>
                <input type="checkbox" id="featurePerformance" name="features" value="Performance">
                
            </fieldset>
        
            <fieldset>
                <label for="writtenReview" class="bold">Written Review (Optional)</label><br>
                <textarea id="writtenReview" name="writtenReview" rows="5" cols="40"></textarea>
            </fieldset>
        
            <fieldset>
                <label for="userName" class="bold">Your Name (optional)</label><br>
                <input type="text" id="userName" name="userName">
            </fieldset>
        
            <input type="submit" value="Post Review">
        
        </form>

        <div class="subfoot">
            <p>* Indicates required fields</p>
        </div>
    </main>

    <footer><p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
    <p id="lastModified"></p></footer>
</body>
</html>
