<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description" content="A webpage designed to demonstrate strong skills in building and editing interactive forms using HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
        
            <fieldset>
                <label for="productName">Product Name</label>

                <select id="productName" name="productName" required>

                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>
        
            <fieldset>
                <legend>Overall Rating</legend>
        
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">☆</label><br>
        
                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating2">☆☆</label><br>
        
                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating3">☆☆☆</label><br>
        
                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating4">☆☆☆☆</label><br>
        
                <input type="radio" id="rating5" name="rating" value="5">
                <label for="rating5">☆☆☆☆☆</label>
            </fieldset>
        
            <fieldset>
                <label for="installDate">Date of Installation</label>

                <input type="date" id="installDate" name="installDate" required>
            </fieldset>
        
            <fieldset>
                <legend>Useful Features</legend>
        
                <input type="checkbox" id="featureEase" name="features" value="Ease of Use">
                <label for="featureEase">Ease of Use</label><br>
        
                <input type="checkbox" id="featurePerformance" name="features" value="Performance">
                <label for="featurePerformance">Performance</label><br>
        
                <input type="checkbox" id="featureDesign" name="features" value="Design">
                <label for="featureDesign">Design</label><br>
        
                <input type="checkbox" id="featureSupport" name="features" value="Customer Support">
                <label for="featureSupport">Customer Support</label>
            </fieldset>
        
            <fieldset>
                <label for="writtenReview">Written Review</label>
                <textarea id="writtenReview" name="writtenReview" rows="5" cols="40"></textarea>
            </fieldset>
        
            <fieldset>
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName">
            </fieldset>
        
            <input type="submit" value="Submit Review">
        
        </form>
    </main>

    <footer><p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
    <p id="lastModified"></p></footer>
</body>
</html>
