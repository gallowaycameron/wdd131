<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Forge - Dice Rolling</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description" content="A webpage that lets users choose which dice to roll and then displays the values of the selected dice">
    <link rel="stylesheet" href="styles/dice.css">
    <link rel="stylesheet" href="styles/nav.css">
    <script src="scripts/dnd-site.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/dice.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
 
<body>
    <header>
        <img src="images/critical-forge-logo.webp"
            alt="The logo for Critical Forge. It is a twenty sided dice with a hand holding a hammer in the middle.">
    
        <h2>Critical Forge</h2>
    
        <button id="menuBtn" aria-label="Menu">☰</button>
    
        <nav>
            <button id="closeBtn" aria-label="Close menu">✕</button>
    
            <a href="index.html">Home</a>
            <a href="character.html">Characters</a>
            <a href="dice.html">Dice Roller</a>
            <a href="reference.html">Reference Sheet</a>
            <a href="sign-up.html" class="cta">Sign Up</a>
        </nav>
    </header>

<div class="hero-banner-container">
    <img src="images/red-dice.webp" alt="Dice rolling banner">
    <h1>Dice Roller</h1>
</div>

<main>
    <label for="dice">Choose a die:</label>
    <select id="dice">
        <option value="4">d4</option>
        <option value="6">d6</option>
        <option value="8">d8</option>
        <option value="10">d10</option>
        <option value="12">d12</option>
        <option value="20">d20</option>
    </select>
    <hr>

    <label for="quantity">How many?</label>
    <input type="number" id="quantity" value="0" min="0">
    <hr>
    
    <button id="roll">Roll</button>
    <p id="result"></p>
</main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
