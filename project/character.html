<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Forge - Character Creator</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description"
        content="A webpage that assists users in creating a character by describing available attributes and guiding them through the assignment of stats and values">
    <link rel="stylesheet" href="styles/character.css">
    <link rel="stylesheet" href="styles/nav.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <script src="scripts/dnd-site.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/character.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img src="images/critical-forge-logo.webp"
            alt="The logo for Critical Forge. It is a twenty sided dice with a hand holding a hammer in the middle.">

        <h2>Critical Forge</h2>

        <button id="menuBtn" aria-label="Menu">☰</button>

        <nav>
            <button id="closeBtn" aria-label="Close menu">✕</button>

            <a href="index.html">Home</a>
            <a href="character.html">Characters</a>
            <a href="dice.html">Dice Roller</a>
            <a href="reference.html">Reference Sheet</a>
            <a href="sign-up.html" class="cta">Sign Up</a>
        </nav>
    </header>

    <main class="page-bg">
        <picture>
            <source srcset="images/long-waterfall.webp" media="(max-width: 768px)">
            <img src="images/dice-in-book.webp" alt="Black twenty-sided die resting inside a book"
                class="page-bg-image">
        </picture>

        <div class="page-content">
            <h1 class="titles">Character Creator</h1>

            <form id="charForm">

                <label for="name">*Name</label>
                <input type="text" id="name" placeholder="First Last" required>

                <label for="race">*Race</label>
                <select id="race" required>
                    <option value="" disabled selected hidden>Select Race</option>
                    <option value="Aasimar">Aasimar</option>
                    <option value="Dragonborn">Dragonborn</option>
                    <option value="Dwarf">Dwarf</option>
                    <option value="Elf">Elf</option>
                    <option value="Gnome">Gnome</option>
                    <option value="Goliath">Goliath</option>
                    <option value="Halfling">Halfling</option>
                    <option value="Human">Human</option>
                    <option value="Orc">Orc</option>
                    <option value="Tiefling">Tiefling</option>
                </select>

                <label for="characterClass">*Class</label>
                <select id="characterClass" required>
                    <option value="" disabled selected hidden>Select Class</option>
                    <option value="Barbarian">Barbarian</option>
                    <option value="Bard">Bard</option>
                    <option value="Cleric">Cleric</option>
                    <option value="Druid">Druid</option>
                    <option value="Fighter">Fighter</option>
                    <option value="Monk">Monk</option>
                    <option value="Paladin">Paladin</option>
                    <option value="Ranger">Ranger</option>
                    <option value="Rogue">Rogue</option>
                    <option value="Sorcerer">Sorcerer</option>
                    <option value="Warlock">Warlock</option>
                    <option value="Wizard">Wizard</option>
                </select>

                <div class="stats">
                    <div class="stat">
                        <label for="str">STR</label>
                        <input type="number" id="str" min="8" max="15" value="8" required>
                    </div>
                    <div class="stat">
                        <label for="dex">DEX</label>
                        <input type="number" id="dex" min="8" max="15" value="8" required>
                    </div>
                    <div class="stat">
                        <label for="con">CON</label>
                        <input type="number" id="con" min="8" max="15" value="8" required>
                    </div>
                    <div class="stat">
                        <label for="int">INT</label>
                        <input type="number" id="int" min="8" max="15" value="8" required>
                    </div>
                    <div class="stat">
                        <label for="wis">WIS</label>
                        <input type="number" id="wis" min="8" max="15" value="8" required>
                    </div>
                    <div class="stat">
                        <label for="cha">CHA</label>
                        <input type="number" id="cha" min="8" max="15" value="8" required>
                    </div>
                </div>


                <button type="submit">Create Character</button>
            </form>

            <h2 class="titles">Characters</h2>
            <div id="charContainer"></div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
