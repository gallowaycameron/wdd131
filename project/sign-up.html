<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Forge - Sign-up Page</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description" content="A page to allow the user to sign up for info about campaigns and any news">
    <link rel="stylesheet" href="styles/sign-up.css">
    <link rel="stylesheet" href="styles/nav.css">
    <script src="scripts/dnd-site.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/sign-up.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img src="images/critical-forge-logo.webp"
            alt="The logo for Critical Forge. It is a twenty sided dice with a hand holding a hammer in the middle.">
    
        <h2>Critical Forge</h2>
    
        <button id="menuBtn" aria-label="Menu">☰</button>
    
        <nav>
            <button id="closeBtn" aria-label="Close menu">✕</button>
    
            <a href="index.html">Home</a>
            <a href="character.html">Characters</a>
            <a href="dice.html">Dice Roller</a>
            <a href="reference.html">Reference Sheet</a>
            <a href="sign-up.html" class="cta">Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source srcset="images/long-dragon.webp" media="(max-width: 768px)">
                <img src="images/river-map.webp" alt="A DnD map showcasing a camp by a river" class="guild-image">
            </picture>
    
            <div class="hero-overlay"></div>
    
            <div class="hero-text">
                <h1>Join the Guild</h1>
                <p class="join">Want to join other fellow adventurers? Sign up for our Guild and receive notifications about
                    adventures you can join!</p>
            </div>
        </section>
        
        <form id="signupForm">
            <label for="name">*Your Name</label>
            <input type="text" id="name" name="name" required>
    
            <label for="email">*Email</label>
            <input type="email" id="email" name="email" required>

            <label for="username">*Adventurer Name</label>
            <input type="text" id="username" name="username" required>
    
            <label for="race">Choose Your Character's Race</label>
            <select id="race" name="race">
                <option value="" disabled selected hidden>-- Select Race --</option>
                <option>Aasimar</option>
                <option>Dragonborn</option>
                <option>Dwarf</option>
                <option>Elf</option>
                <option>Gnome</option>
                <option>Goliath</option>
                <option>Halfling</option>
                <option>Human</option>
                <option>Orc</option>
                <option>Tiefling</option>
            </select>
    
            <label for="class">Choose Your Character's Class</label>
            <select id="class" name="class">
                <option value="" disabled selected hidden>-- Select Class --</option>
                <option>Barbarian</option>
                <option>Bard</option>
                <option>Cleric</option>
                <option>Druid</option>
                <option>Fighter</option>
                <option>Monk</option>
                <option>Paladin</option>
                <option>Ranger</option>
                <option>Rogue</option>
                <option>Sorcerer</option>
                <option>Warlock</option>
                <option>Wizard</option>
            </select>
    
            <label for="level">Starting Level</label>
            <input type="number" id="level" min="1" max="20" value="1" name="level">
    
            <label>Preferred Play Style</label> 
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="style" value="Roleplay">
                    Roleplay
                </label>
            
                <label class="radio-item">
                    <input type="radio" name="style" value="Combat">
                    Combat
                </label>
            
                <label class="radio-item">
                    <input type="radio" name="style" value="Balanced">
                    Balanced
                </label>
            </div>
    
            <label for="backstory">Character Backstory</label>
            <textarea id="backstory" rows="4" placeholder="Tell us your legend..." name="backstory"></textarea>
    
            <button type="submit">Sign Up for Adventure</button>
    
            <p id="message"></p>
    
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
