<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Forge - Home Page</title>
    <meta name="author" content="Cameron Galloway">
    <meta name="description"
        content="The home page for the author’s final project assignment, designed to showcase the website and provide users with access to its available features">
    <link rel="stylesheet" href="styles/sign-up.css">
    <link rel="stylesheet" href="styles/nav.css">
    <script src="scripts/dnd-site.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
    <script src="scripts/sign-up.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img src="images/critical-forge-logo.webp"
            alt="The logo for Critical Forge. It is a twenty sided dice with a hand holding a hammer in the middle.">
    
        <h2>Critical Forge</h2>
    
        <button id="menuBtn" aria-label="Menu">☰</button>
    
        <nav>
            <button id="closeBtn" aria-label="Close menu">✕</button>
    
            <a href="index.html">Home</a>
            <a href="character.html">Characters</a>
            <a href="dice.html">Dice Roller</a>
            <a href="reference.html">Reference Sheet</a>
            <a href="sign-up.html" class="cta">Sign Up</a>
        </nav>
    </header>

    <main>
        <h1>Join the Guild</h1>
    
        <form id="signupForm">
    
            <label for="username">Adventurer Name</label>
            <input type="text" id="username" required>
    
            <label for="email">Guild Email</label>
            <input type="email" id="email" required>
    
            <label for="race">Choose Your Race</label>
            <select id="race" required>
                <option value="" disabled selected hidden>-- Select Race --</option>
                <option>Aasimar</option>
                <option>Dragonborn</option>
                <option>Dwarf</option>
                <option>Elf</option>
                <option>Gnome</option>
                <option>Goliath</option>
                <option>Halfling</option>
                <option>Human</option>
                <option>Orc</option>
                <option>Tiefling</option>
            </select>
    
            <label for="class">Choose Your Class</label>
            <select id="class" required>
                <option value="" disabled selected hidden>-- Select Class --</option>
                <option>Barbarian</option>
                <option>Bard</option>
                <option>Cleric</option>
                <option>Druid</option>
                <option>Fighter</option>
                <option>Monk</option>
                <option>Paladin</option>
                <option>Ranger</option>
                <option>Rogue</option>
                <option>Sorcerer</option>
                <option>Warlock</option>
                <option>Wizard</option>
            </select>
    
            <label for="level">Starting Level</label>
            <input type="number" id="level" min="1" max="20" value="1">
    
            <label>Preferred Play Style</label>
            <div>
                <input type="radio" name="style" value="Roleplay" required> Roleplay
                <input type="radio" name="style" value="Combat"> Combat
                <input type="radio" name="style" value="Balanced"> Balanced
            </div>
    
            <label for="backstory">Character Backstory</label>
            <textarea id="backstory" rows="4" placeholder="Tell us your legend..."></textarea>
    
            <button type="submit">Join the Adventure</button>
    
            <p id="message"></p>
    
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Cameron Galloway - Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
